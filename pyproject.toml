[project]
name = "zhuyin-code"
version = "0.1.0"
description = "注音碼：品名轉搜尋碼（注音首音／倉頡首碼），跨語言可攜對照表"
license = "MIT"
readme = "README.md"
authors = [
    { name = "jerry", email = "ynp123ai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
zhuyin-code = "zhuyin_code:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
